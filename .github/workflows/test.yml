name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: gradle test bundleWebCraftFrontend

      - name: Check frontend JavaScript
        run: |
          for script in modules/webcraft/frontend/*.mjs; do
            node --check "$script" || exit
          done

      - name: Run frontend tests
        run: node --test modules/webcraft/frontend/test/*.test.mjs
