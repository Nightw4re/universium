name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - name: Detect changed module versions
        id: modules
        shell: bash
        run: |
          changed_modules=$(git diff --name-only --diff-filter=AMR HEAD~1 HEAD -- 'modules/webcraft/*/gradle.properties' \
            | awk -F/ 'NF == 4 && $3 ~ /^(core|equipment|exporter|catalog|designs)$/ { print "webcraft-" $3 }' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$changed_modules" = "[]" ]; then
            echo 'modules=[]' >> "$GITHUB_OUTPUT"
          else
            echo "modules=$changed_modules" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJson(needs.detect.outputs.modules) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build module
        run: gradle :${{ matrix.module }}:build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-build
          path: modules/webcraft/*/build/libs/${{ matrix.module }}-*.jar
          if-no-files-found: error

  deploy-curseforge:
    needs: [detect, build]
    if: needs.detect.outputs.modules != '[]' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJson(needs.detect.outputs.modules) }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.module }}-build
          path: build
      - name: Deploy to CurseForge
        run: echo "Deploying ${{ matrix.module }} to CurseForge"

  deploy-modrinth:
    needs: [detect, build]
    if: needs.detect.outputs.modules != '[]' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJson(needs.detect.outputs.modules) }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.module }}-build
          path: build
      - name: Deploy to Modrinth
        run: echo "Deploying ${{ matrix.module }} to Modrinth"
