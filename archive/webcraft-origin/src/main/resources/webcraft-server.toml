[server]
enabled = true
auto_port = true
kill_existing_on_start = true
use_https = false
host = "127.0.0.1"
port = 8087
public_url = "http://127.0.0.1:8087"
minecraft_version = "1.21.1"
neoforge_build = 224
server_name = "WebCraft Dev Server"
minecraft_server_name = "WebCraft Dev Server"
minecraft_server_address = "127.0.0.1:25565"
keystore_path = ""
keystore_password = ""
keystore_type = "JKS"
webroot_dir = "../webroot"
webroot_index = "index.html"
http_bootstrap_async = true
generate_resources_at_start = true
resources_warmup_async = true
resources_warmup_batch_size = 32
resources_warmup_pause_ms = 10
resources_cache_max_age_seconds = 604800
# Web-specific fallback order for preview/icon resolution.
# Leave empty to keep the order from resourcepacks.txt.
resource_packs_web_order = []

[frontend]
mode = "built_in"
theme = "default"

[logging]
access_enabled = true
error_enabled = true
access_file = "logs/webcraft-access.log"
error_file = "logs/webcraft-error.log"

[route."GET /server-info"]
type = "java"
ref = "webcraft.serverInfo"

[route."GET /player-list"]
type = "java"
ref = "webcraft.playerNames"

[route."GET /player-list/online"]
type = "java"
ref = "webcraft.playerOnlineNames"
