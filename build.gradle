plugins {
    id "base"
}

allprojects {
    group = "com.universium"

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: "java"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

tasks.register("runClient") {
    group = "application"
    description = "Runs the NeoForge client with WebCraft."
    dependsOn(":webcraft-core:runClient")
}

tasks.register("runServer") {
    group = "application"
    description = "Runs the NeoForge server with WebCraft."
    dependsOn(":webcraft-core:runServer")
}

tasks.register("bundleWebCraftFrontend", Zip) {
    group = "build"
    description = "Packages the static WebCraft frontend for independent hosting."
    archiveFileName = "frontend-dist.zip"
    destinationDirectory = layout.buildDirectory.dir("distributions")
    reproducibleFileOrder = true
    preserveFileTimestamps = false
    from("modules/webcraft/frontend") {
        include "index.html", "style.css", "*.mjs"
        exclude "dev.mjs", "local.mjs"
    }
}

tasks.register("buildDocs", Copy) {
    group = "documentation"
    description = "Collects Markdown documentation from project docs folders."

    def sourceDirs = []
    def rootDocs = file("docs")
    if (rootDocs.exists()) {
        sourceDirs << rootDocs
    }

    file("modules").listFiles()?.each { moduleDir ->
        def moduleDocs = new File(moduleDir, "docs")
        if (moduleDocs.exists() && moduleDocs.isDirectory()) {
            sourceDirs << moduleDocs
        }
    }

    from(sourceDirs) {
        include("**/*.md")
    }
    into(layout.buildDirectory.dir("docs"))
}

