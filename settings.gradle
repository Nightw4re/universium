pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            url = uri("https://maven.neoforged.net/releases")
        }
    }
}

rootProject.name = "universium"

["core", "equipment", "catalog", "designs", "quests", "ponder"].each { module ->
    include("webcraft-${module}")
    project(":webcraft-${module}").projectDir = file("modules/webcraft/${module}")
}

