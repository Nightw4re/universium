plugins {
    id "java"
    id "net.neoforged.moddev" version "1.0.11"
}

version = findProperty("modVersion") ?: "0.1.0"
def modId = "webcraft"
def modName = "webcraft"
def modLicense = "All Rights Reserved"
def minecraftVersion = "1.21.1"
def neoVersion = "21.1.224"
def neoVersionRange = "[21.1.224,)"
def minecraftVersionRange = "[1.21.1,1.21.2)"
def loaderVersionRange = "[1,)"

dependencies {
}

def frontendDir = layout.projectDirectory.dir("frontend").asFile
def frontendDist = new File(frontendDir, "dist")
def webrootDir = layout.buildDirectory.dir("webroot")
def npmCommand = System.getProperty("os.name").startsWith("Windows") ? ["cmd", "/d", "/c", "npm.cmd"] : ["npm"]

tasks.register("installFrontendDependencies", Exec) {
    group = "build"
    description = "Installs the locked npm dependencies for the WebCraft frontend."
    workingDir = frontendDir
    commandLine = npmCommand + ["ci"]
    inputs.files(new File(frontendDir, "package.json"), new File(frontendDir, "package-lock.json"))
    outputs.dir(new File(frontendDir, "node_modules"))
}

tasks.register("buildFrontend", Exec) {
    group = "build"
    description = "Builds the WebCraft frontend into frontend/dist."
    dependsOn(tasks.named("installFrontendDependencies"))
    workingDir = frontendDir
    commandLine = npmCommand + ["run", "build", "--", "--outDir", "dist"]
    inputs.files(fileTree(frontendDir) {
        exclude("node_modules/**", "dist/**", "storybook-static/**", ".tmp-mc-sources/**", "coverage/**", ".vite/**", "**/*.log")
    })
    outputs.dir(frontendDist)
}

tasks.register("syncFrontendWebroot", Sync) {
    group = "build"
    description = "Copies the built frontend artifact into the build webroot."
    dependsOn(tasks.named("buildFrontend"))
    from(frontendDist)
    into(webrootDir)
}

tasks.named("processResources", ProcessResources).configure {
    dependsOn(tasks.named("syncFrontendWebroot"))
}

testing {
    suites {
        test {
            useJUnitJupiter("5.10.2")
        }
    }
}

tasks.named("processResources", ProcessResources).configure {
    def modVersion = project.version.toString()

    inputs.properties([
            mod_id: modId,
            mod_name: modName,
            mod_version: modVersion,
            mod_license: modLicense,
            minecraft_version: minecraftVersion,
            neo_version: neoVersion,
            neo_version_range: neoVersionRange,
            minecraft_version_range: minecraftVersionRange,
            loader_version_range: loaderVersionRange,
    ])
    filesMatching("META-INF/neoforge.mods.toml") {
        expand([
                mod_id: modId,
                mod_name: modName,
                mod_version: modVersion,
                mod_license: modLicense,
                minecraft_version: minecraftVersion,
                neo_version: neoVersion,
                neo_version_range: neoVersionRange,
                minecraft_version_range: minecraftVersionRange,
                loader_version_range: loaderVersionRange,
        ])
    }
}

neoForge {
    version = project.findProperty("neo_version")
    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty "neoforge.enabledGameTestNamespaces", "webcraft"
        }
        server {
            server()
            programArgument "--nogui"
        }
    }

    mods {
        webcraft {
            sourceSet sourceSets.main
        }
    }
}

