plugins {
    id "net.neoforged.moddev" version "1.0.11"
}

base {
    archivesName = "webcraft"
}

version = property("modVersion")
def neoForgeVersion = property("neoVersion")
def swaggerUiVersion = "5.34.1"

configurations {
    swaggerUiAssets {
        canBeConsumed = false
    }
}

dependencies {
    swaggerUiAssets("org.webjars:swagger-ui:${swaggerUiVersion}")
    // Minecraft supplies the other Netty modules at this version.
    def nettyHttp = "io.netty:netty-codec-http:4.1.97.Final"
    jarJar(implementation(nettyHttp))
    additionalRuntimeClasspath(nettyHttp) { transitive = false }
}

testing {
    suites {
        test {
            useJUnitJupiter("5.10.2")
        }
    }
}

neoForge {
    version = neoForgeVersion
    addModdingDependenciesTo sourceSets.test
    mods {
        webcraft_core {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            gameDirectory = rootProject.file(".local-artifacts/webcraft-exporter/client")
        }
        server {
            server()
            gameDirectory = rootProject.file(".local-artifacts/webcraft-core/server")
            programArgument "--nogui"
        }
    }
}

apply from: file("../exporter/exporter.gradle")

tasks.named("processResources", ProcessResources).configure {
    def metadata = [mod_version: project.version.toString(), neo_version: neoForgeVersion]
    inputs.properties(metadata)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(metadata)
    }
    from({ zipTree(configurations.swaggerUiAssets.singleFile) }) {
        includeEmptyDirs = false
        include "**/swagger-ui-bundle.js", "**/swagger-ui-bundle.js.LICENSE.txt", "**/swagger-ui.css"
        eachFile { details -> details.path = "webcraft-api/" + details.name }
    }
}
