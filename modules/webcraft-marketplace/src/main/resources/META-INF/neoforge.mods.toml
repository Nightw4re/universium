side="BOTH"

[[dependencies.webcraft-marketplace]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.webcraft-marketplace]]
modId="webcraft"
type="required"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
